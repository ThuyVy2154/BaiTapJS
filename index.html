<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài tập JavaScript Buổi 2-3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="bg-light py-5">
  <div class="container" style="max-width: 700px;">
    <h2 class="text-center mb-4 text-primary">BÀI TẬP JAVASCRIPT</h2>

    <!-- BÀI 1 -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-primary text-white fw-bold">Bài 1: Tính tiền lương nhân viên</div>
      <div class="card-body">
        <div class="mb-3">
          <label for="soNgayLam" class="form-label">Số ngày làm việc:</label>
          <input type="number" id="soNgayLam" class="form-control" placeholder="Nhập số ngày làm" />
        </div>
        <button id="btnTinhLuong" class="btn btn-primary">Tính lương</button>
        <div id="ketQuaB1" class="alert alert-info mt-3 d-none"></div>
      </div>
    </div>

    <!-- BÀI 2 -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-success text-white fw-bold">Bài 2: Tính giá trị trung bình của 5 số thực</div>
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col"><input type="number" step="any" id="num1" class="form-control" placeholder="Số 1" /></div>
          <div class="col"><input type="number" step="any" id="num2" class="form-control" placeholder="Số 2" /></div>
          <div class="col"><input type="number" step="any" id="num3" class="form-control" placeholder="Số 3" /></div>
          <div class="col"><input type="number" step="any" id="num4" class="form-control" placeholder="Số 4" /></div>
          <div class="col"><input type="number" step="any" id="num5" class="form-control" placeholder="Số 5" /></div>
        </div>
        <button id="btnTinhTB" class="btn btn-success">Tính trung bình</button>
        <div id="ketQuaB2" class="alert alert-info mt-3 d-none"></div>
      </div>
    </div>

    <!-- BÀI 3 -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-warning text-dark fw-bold">Bài 3: Quy đổi tiền USD sang VND</div>
      <div class="card-body">
        <div class="mb-3">
          <label for="soTienUSD" class="form-label">Số tiền USD:</label>
          <input type="number" id="soTienUSD" class="form-control" placeholder="Nhập số tiền USD" />
        </div>
        <button id="btnDoiTien" class="btn btn-warning">Quy đổi</button>
        <div id="ketQuaB3" class="alert alert-info mt-3 d-none"></div>
      </div>
    </div>

    <!-- BÀI 4 -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-danger text-white fw-bold">Bài 4: Tính diện tích, chu vi hình chữ nhật</div>
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col">
            <label for="chieuDai" class="form-label">Chiều dài:</label>
            <input type="number" step="any" id="chieuDai" class="form-control" placeholder="Nhập chiều dài" />
          </div>
          <div class="col">
            <label for="chieuRong" class="form-label">Chiều rộng:</label>
            <input type="number" step="any" id="chieuRong" class="form-control" placeholder="Nhập chiều rộng" />
          </div>
        </div>
        <button id="btnTinhHCN" class="btn btn-danger">Tính chu vi & diện tích</button>
        <div id="ketQuaB4" class="alert alert-info mt-3 d-none"></div>
      </div>
    </div>

    <!-- BÀI 5 -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-secondary text-white fw-bold">Bài 5: Tính tổng 2 ký số</div>
      <div class="card-body">
        <div class="mb-3">
          <label for="soHaiChuSo" class="form-label">Nhập 1 số có 2 chữ số:</label>
          <input type="number" id="soHaiChuSo" class="form-control" placeholder="Ví dụ: 12, 44, 83" />
        </div>
        <button id="btnTongKySo" class="btn btn-secondary">Tính tổng</button>
        <div id="ketQuaB5" class="alert alert-info mt-3 d-none"></div>
      </div>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
